name: GitHub Pages smoke test

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  smoke-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check public demo
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location https://marco4sc.github.io/PortfolioHUB/docs/demo/index.html | grep -q "AI Job Apply"
          curl --fail --silent --show-error --location https://marco4sc.github.io/PortfolioHUB/docs/demo/privacy.html | grep -q "Privacidade"
          curl --fail --silent --show-error --location https://marco4sc.github.io/PortfolioHUB/docs/demo/dashboard.html | grep -q "revisão humana"
