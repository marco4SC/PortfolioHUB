name: CI & GitHub Pages Preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install html-validate
        run: npm install -g html-validate
      - name: Run HTML validation
        run: html-validate "**/*.html"

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF renderer
        run: npm install --no-save puppeteer
      - name: Render resume PDFs (pt-BR and en)
        run: |
          node scripts/render-curriculo-pdf.mjs curriculo.html Marco-Antonio-de-Souza-Carvalho-Curriculo.pdf
          node scripts/render-curriculo-pdf.mjs curriculo.en.html Marco-Antonio-de-Souza-Carvalho-Resume.pdf
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true

  verify-pages:
    name: Verify published Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check published pages
        run: |
          set -euo pipefail
          base="https://marco4sc.github.io/PortfolioHUB"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$base/" | grep -q "Marco Antonio"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$base/projetos.html" | grep -q "AI Job Apply"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$base/sitemap.xml" | grep -q "projetos.en.html"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$base/curriculo.html" | grep -q "Marco Antonio de Souza Carvalho"
          curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$base/curriculo.en.html" | grep -q "Marco Antonio de Souza Carvalho"
          # Confirma que os PDFs publicados sao PDFs validos, nao paginas 404
          for pdf in Marco-Antonio-de-Souza-Carvalho-Curriculo.pdf Marco-Antonio-de-Souza-Carvalho-Resume.pdf; do
            curl --fail --silent --show-error --location --retry 8 --retry-delay 5 "$base/$pdf" | head -c 4 | grep -q "%PDF"
          done
