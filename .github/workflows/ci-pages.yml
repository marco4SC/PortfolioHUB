name: CI & GitHub Pages Preview

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  validate-html:
    name: Validate HTML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install html-validate
        run: npm install -g html-validate
      - name: Run HTML validation
        run: html-validate "**/*.html"

  deploy-pages:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: validate-html
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install PDF renderer
        run: npm install --no-save puppeteer
      - name: Render resume PDFs (pt-BR and en)
        run: |
          node scripts/render-curriculo-pdf.mjs curriculo.html Marco-Antonio-de-Souza-Carvalho-Curriculo.pdf
          node scripts/render-curriculo-pdf.mjs curriculo.en.html Marco-Antonio-de-Souza-Carvalho-Resume.pdf
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./
          publish_branch: gh-pages
          force_orphan: true
          # O site publica a raiz do repo; isto mantem fora do Pages o codigo do
          # backend, scripts, testes, entregas academicas (zips/caches) e arquivos
          # de desenvolvimento. Nenhuma pagina publicada referencia esses caminhos.
          exclude_assets: '.github,backend,scripts,tests,templates,data,frontend,academicos,pessoais,LOCAL_SETUP.md,htmlvalidate-check.txt,htmlvalidate-output.txt,.htmlvalidate.json'

  verify-pages:
    name: Verify published Pages
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: deploy-pages
    runs-on: ubuntu-latest
    steps:
      - name: Check published pages
        run: |
          set -euo pipefail
          base="https://marco4sc.github.io/PortfolioHUB"
          # Baixa para arquivo antes de checar: `curl | grep -q` falhava de forma
          # intermitente, porque o grep -q fecha o pipe ao achar o texto, o curl
          # recebe erro 23 de escrita e o pipefail derruba o step.
          # O laco tambem espera o build do Pages, que termina alguns minutos
          # depois do push no gh-pages (antes disso paginas novas dao 404).
          check() {
            local url="$base/$1" pattern="$2"
            for attempt in $(seq 1 20); do
              if curl --fail --silent --location "$url" -o page.tmp && grep -aq -- "$pattern" page.tmp; then
                echo "OK  $url"
                return 0
              fi
              sleep 15
            done
            echo "::error::$url nao respondeu com '$pattern' apos 5 minutos"
            return 1
          }
          check "" "Marco Antonio"
          check "projetos.html" "AI Job Apply"
          check "sitemap.xml" "projetos.en.html"
          check "curriculo.html" "Marco Antonio de Souza Carvalho"
          check "curriculo.en.html" "Marco Antonio de Souza Carvalho"
          # Confirma que os PDFs publicados sao PDFs validos, nao paginas 404
          check "Marco-Antonio-de-Souza-Carvalho-Curriculo.pdf" "%PDF"
          check "Marco-Antonio-de-Souza-Carvalho-Resume.pdf" "%PDF"
