name: Build & Deploy AI Investment Backend

on:
  push:
    branches:
      - main
      - 'feature/**'
    # So reconstroi a imagem quando o backend muda, nao a cada edicao do site.
    paths:
      - 'pessoais/ai-investment-system/**'
      - '.github/workflows/deploy-backend.yml'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
      # Tags de imagem Docker exigem minusculas; o dono do repo e "marco4SC".
      - name: Compute lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/ai-investment" >> "$GITHUB_ENV"
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./pessoais/ai-investment-system
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}

  optional-deploy-render:
    needs: build-and-push
    runs-on: ubuntu-latest
    # O contexto `secrets` nao e permitido em `if` de job (o workflow inteiro
    # fica invalido). Os segredos viram env do job e a checagem vai no step.
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
    steps:
      - name: Trigger Render deploy
        if: ${{ env.RENDER_API_KEY != '' && env.RENDER_SERVICE_ID != '' }}
        run: |
          echo "Triggering deploy on Render for service $RENDER_SERVICE_ID"
          curl --fail -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

# Notes:
# - To automatically deploy to Render, add repository secrets: RENDER_API_KEY and RENDER_SERVICE_ID
# - The workflow builds and pushes a container image to GitHub Container Registry (GHCR). Use that image on any cloud provider.
