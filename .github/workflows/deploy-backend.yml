name: Build & Deploy AI Investment Backend

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: ./pessoais/ai-investment-system
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/ai-investment:latest
            ghcr.io/${{ github.repository_owner }}/ai-investment:${{ github.sha }}

  optional-deploy-render:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Check Render secrets
        id: check-secrets
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          # If either secret is missing, mark deploy=false
          if [ -z "$RENDER_API_KEY" ] || [ -z "$RENDER_SERVICE_ID" ]; then
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "Render secrets not configured. Skipping deploy." >&2
            exit 0
          fi
          echo "deploy=true" >> $GITHUB_OUTPUT

      - name: Trigger Render deploy
        if: ${{ steps.check-secrets.outputs.deploy == 'true' }}
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          echo "Triggering deploy on Render for service $RENDER_SERVICE_ID"
          curl -sS -X POST \
            -H "Authorization: Bearer $RENDER_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{}' \
            "https://api.render.com/v1/services/$RENDER_SERVICE_ID/deploys"

# Notes:
# - To automatically deploy to Render, add repository secrets: RENDER_API_KEY and RENDER_SERVICE_ID
# - The workflow builds and pushes a container image to GitHub Container Registry (GHCR). Use that image on any cloud provider.


